    ReceiveInput:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        batch_number:
          type: string
          maxLength: 80
        expiry:
          type: string
          format: date
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        unit_cost_minor:
          type: integer
          maximum: 100000000
          minimum: 0
        supplier:
          type: string
          maxLength: 120
        reference:
          type: string
          maxLength: 80
        location:
          type: string
          default: A-01
          maxLength: 40
      required:
      - batch_number
      - expiry
      - product_id
      - quantity
      - reference
      - supplier
      - unit_cost_minor
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 150
        branch:
          type: string
          maxLength: 120
        address:
          type: string
          default: ''
          maxLength: 250
      required:
      - branch
      - email
      - name
      - organization
      - password
    RoleEnum:
      enum:
      - manager
      - cashier
      - auditor
      - pharmacist
      - inventory
      - accountant
      type: string
      description: |-
        * `manager` - manager
        * `cashier` - cashier
        * `auditor` - auditor
        * `pharmacist` - pharmacist
        * `inventory` - inventory
        * `accountant` - accountant
    UnitInput:
      type: object
      properties:
