components:
  schemas:
    AcceptInviteInput:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 128
        code:
          type: string
          default: ''
          maxLength: 64
      required:
      - name
      - password
      - token
    BranchInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        address:
          type: string
          default: ''
          maxLength: 250
      required:
      - name
    CartLineInput:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
        expected_price_minor:
          type: integer
          maximum: 100000000
          minimum: 0
        unit_id:
          type: string
          format: uuid
          nullable: true
        expected_base_units:
          type: integer
          maximum: 10000
          minimum: 1
      required:
      - expected_price_minor
      - product_id
      - quantity
    CheckoutInput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLineInput'
        tendered_minor:
          type: integer
          maximum: 1000000000000
          minimum: 0
          format: int64
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_reference:
          type: string
          pattern: ^[A-Za-z0-9_-]{4,80}$
        payment_confirmed:
          type: boolean
        customer_id:
          type: string
          format: uuid
          nullable: true
        customer_name:
          type: string
          maxLength: 100
        customer_phone:
          type: string
          pattern: ^[+0-9 ()-]{0,25}$
        customer_address:
          type: string
          maxLength: 250
        customer_bin:
          type: string
          pattern: ^\d{13}$
        customer_type:
          $ref: '#/components/schemas/CustomerTypeEnum'
        staff_name:
          type: string
          maxLength: 100
        created_by:
          type: string
          maxLength: 100
        remarks:
          type: string
          maxLength: 500
      required:
      - lines
      - tendered_minor
    CodeInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
      required:
      - code
    CustomerInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          default: ''
          maxLength: 25
        address:
          type: string
          default: ''
          maxLength: 250
        bin:
          type: string
          default: ''
          pattern: ^[0-9]{13}$
      required:
      - name
    CustomerTypeEnum:
      enum:
      - Retail
      - Delivery
      - Collection
      type: string
      description: |-
        * `Retail` - Retail
        * `Delivery` - Delivery
        * `Collection` - Collection
    EnrollmentInput:
      type: object
      properties:
        password:
          type: string
          maxLength: 128
      required:
      - password
    FormEnum:
      enum:
      - Tablets
      - Capsules
      - Syrups
      - Injections
      - Supplies
      type: string
      description: |-
        * `Tablets` - Tablets
        * `Capsules` - Capsules
        * `Syrups` - Syrups
        * `Injections` - Injections
        * `Supplies` - Supplies
    InviteInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        branch_id:
          type: string
          format: uuid
          nullable: true
      required:
      - email
      - role
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
    NameEnum:
      enum:
      - BOX
      - STRIP
      - PACK
      type: string
      description: |-
        * `BOX` - BOX
        * `STRIP` - STRIP
        * `PACK` - PACK
    PaperWidthEnum:
      enum:
      - 58
      - 80
      type: integer
      description: |-
        * `58` - 58
        * `80` - 80
    PaymentMethodEnum:
      enum:
      - cash
      - bkash
      - nagad
      type: string
      description: |-
        * `cash` - cash
        * `bkash` - bkash
        * `nagad` - nagad
    ProductInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        generic:
          type: string
          maxLength: 150
        strength:
          type: string
          maxLength: 60
        form:
          $ref: '#/components/schemas/FormEnum'
        manufacturer:
          type: string
          maxLength: 120
        prescription_required:
          type: boolean
          default: false
        sku:
          type: string
          maxLength: 40
          pattern: ^[a-zA-Z0-9_-]+$
        barcode:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        price_minor:
          type: integer
          maximum: 100000000
          minimum: 0
        reorder_level:
          type: integer
          maximum: 100000
          minimum: 0
          default: 30
      required:
      - barcode
      - form
      - generic
      - manufacturer
      - name
      - price_minor
      - sku
      - strength
    ReceiptProfileInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 0
        shop_name:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 250
        phone:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 150
        contact_name:
          type: string
          maxLength: 100
        bin:
          type: string
          pattern: ^\d{13}$
        drug_license:
          type: string
          maxLength: 80
        logo_data_url:
          type: string
          maxLength: 1500000
        paper_width:
          $ref: '#/components/schemas/PaperWidthEnum'
        font_size:
          type: integer
          maximum: 14
          minimum: 9
        show_logo:
          type: boolean
        show_batch:
          type: boolean
        show_staff:
